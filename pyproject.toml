[project]
name = "acessorIA"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "google-genai>=1.68.0",
    "langchain>=1.2.14",
    "langchain-google-genai>=4.2.1",
    "langchain-groq>=1.1.1",
    "psycopg2>=2.9.11",
    "pydantic-settings>=2.13.1",
    "langchain-text-splitters>=1.1.2",
    "faiss-cpu>=1.13.2",
    "langchain-community>=0.4.1",
    "pypdf>=6.10.2",
    "rich>=15.0.0",
    "beanie<=2.1.0",
    "motor>=3.3.0,<3.5.0",
    "pymongo<4.7.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.0",
    "ruff==0.15.19",
]

[tool.pytest.ini_options]
minversion = "8.3"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ". src"

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = ["E", "F", "I"]
