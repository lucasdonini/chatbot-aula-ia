[project]
name = "acessorIA"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "google-genai>=1.68.0",
    "langchain>=1.2.14",
    "langchain-google-genai>=4.2.1",
    "langchain-groq>=1.1.1",
    "pydantic-settings>=2.13.1",
    "langchain-text-splitters>=1.1.2",
    "faiss-cpu>=1.13.2",
    "langchain-community>=0.4.1",
    "pypdf>=6.10.2",
    "rich>=15.0.0",
    "beanie>=2.1.0",
    "pymongo>=4.9.0",
    "sqlalchemy>=2.0.49",
    "alembic>=1.18.5",
    "psycopg2-binary>=2.9.12",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.0",
    "ruff==0.15.19",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "testcontainers>=4.0",
]

[tool.pytest.ini_options]
minversion = "8.3"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ". src"

[tool.ruff]
line-length = 88
extend-exclude = ["migrations"]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = ["E", "F", "I"]
