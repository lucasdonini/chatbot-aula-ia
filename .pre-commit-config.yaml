repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.19
    hooks:
      - id: ruff-check
        args: [ --fix ]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy --cache-dir /tmp/.mypy_cache_assessor
        language: system
        args: [ . ]
        pass_filenames: false
        require_serial: true
