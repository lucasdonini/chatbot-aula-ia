repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.19
    hooks:
      - id: ruff-check
        args: [ --fix ]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest-unit
        name: pytest (unit tests)
        entry: pytest -m "not integration"
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
